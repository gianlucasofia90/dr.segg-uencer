name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux (VST3, tests, pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DDRSEGG_BUILD_TESTS=ON -DDRSEGG_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: |
          T=$(find build/Tests -name DrSeggUencerTests -type f -perm -u+x | head -1)
          "$T"
          "$T" --snap editor-linux.png
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          ./pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3/DR. SEGG-UENCER.vst3"
      - name: Package
        run: |
          mkdir -p dist
          cd "build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3" && zip -qr "$GITHUB_WORKSPACE/dist/DrSeggUencer-${GITHUB_REF_NAME//\//-}-Linux-VST3.zip" "DR. SEGG-UENCER.vst3"
      - uses: actions/upload-artifact@v7
        with:
          name: DrSeggUencer-Linux
          path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: editor-screenshot
          path: editor-linux.png

  macos:
    name: macOS (universal VST3 / AU / AAX, auval)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DDRSEGG_BUILD_AAX=ON -DDRSEGG_BUILD_TESTS=ON -DDRSEGG_AAX_COPY_DIR="$PWD/build/aax-installed"
      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel 3 -- -quiet
      - name: Unit tests
        run: |
          T=$(find build/Tests -path "*$BUILD_TYPE*" -name DrSeggUencerTests -type f -perm -u+x | head -1)
          "$T"
      - name: Ad-hoc sign bundles
        run: |
          for b in build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3/*.vst3 build/DrSeggUencer_artefacts/$BUILD_TYPE/AU/*.component \
                   ~/Library/Audio/Plug-Ins/VST3/"DR. SEGG-UENCER.vst3" ~/Library/Audio/Plug-Ins/Components/"DR. SEGG-UENCER.component"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done
      - name: Check minimum macOS version
        run: |
          # the plugins must not depend on the macOS of the build machine
          for b in build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3/*.vst3 build/DrSeggUencer_artefacts/$BUILD_TYPE/AU/*.component; do
            vtool -show-build "$b/Contents/MacOS/DR. SEGG-UENCER" | tee vtool.txt
            grep -q "minos 11.0" vtool.txt
            if grep "minos" vtool.txt | grep -qv "minos 11.0"; then exit 1; fi
          done
      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Dseg Gsof
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            ~/Library/Audio/Plug-Ins/VST3/"DR. SEGG-UENCER.vst3"
      - name: Package
        run: |
          mkdir -p dist
          A=build/DrSeggUencer_artefacts/$BUILD_TYPE
          TAG="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent "$A/VST3/DR. SEGG-UENCER.vst3" "dist/DrSeggUencer-$TAG-macOS-VST3.zip"
          ditto -c -k --keepParent "$A/AU/DR. SEGG-UENCER.component" "dist/DrSeggUencer-$TAG-macOS-AU.zip"
          if [ -d "$A/AAX/DR. SEGG-UENCER.aaxplugin" ]; then
            ditto -c -k --keepParent "$A/AAX/DR. SEGG-UENCER.aaxplugin" "dist/DrSeggUencer-$TAG-macOS-AAX-unsigned.zip"
          fi
          # installer: one approval for the package, and what it installs carries no quarantine
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          ditto "$A/VST3/DR. SEGG-UENCER.vst3" "pkgroot/Library/Audio/Plug-Ins/VST3/DR. SEGG-UENCER.vst3"
          ditto "$A/AU/DR. SEGG-UENCER.component" "pkgroot/Library/Audio/Plug-Ins/Components/DR. SEGG-UENCER.component"
          pkgbuild --analyze --root pkgroot components.plist
          # always to the folders above: VST3 and AU share a bundle id, and the installer must not move them
          n=$(/usr/libexec/PlistBuddy -c "Print" components.plist | grep -c RootRelativeBundlePath)
          for i in $(seq 0 $((n - 1))); do /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist; done
          VERSION=$(sed -n 's/^project(DrSeggUencer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          pkgbuild --root pkgroot --component-plist components.plist --identifier com.gianlucasofia.drsegguencer.pkg \
            --version "$VERSION" --install-location / "dist/DrSeggUencer-$TAG-macOS-Installer.pkg"
      - name: Test the installer
        run: |
          sudo installer -pkg dist/*.pkg -target /
          for b in /Library/Audio/Plug-Ins/VST3/"DR. SEGG-UENCER.vst3" /Library/Audio/Plug-Ins/Components/"DR. SEGG-UENCER.component"; do
            test -f "$b/Contents/MacOS/DR. SEGG-UENCER"
            codesign --verify --deep --strict --verbose=2 "$b"
            if xattr -r "$b" | grep -q com.apple.quarantine; then exit 1; fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: DrSeggUencer-macOS
          path: |
            dist/*.zip
            dist/*.pkg

  windows:
    name: Windows (VST3, pluginval)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DDRSEGG_BUILD_TESTS=ON -DDRSEGG_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel 3
      - name: Unit tests
        shell: bash
        run: |
          T=$(find build/Tests -name DrSeggUencerTests.exe -type f | head -1)
          "$T"
      - name: pluginval (strictness 8)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3/DR. SEGG-UENCER.vst3"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME//\//-}"
          cd "build/DrSeggUencer_artefacts/$BUILD_TYPE/VST3"
          7z a -tzip "$GITHUB_WORKSPACE/dist/DrSeggUencer-$TAG-Windows-VST3.zip" "DR. SEGG-UENCER.vst3" > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: DrSeggUencer-Windows
          path: dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DrSeggUencer-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "DR. SEGG-UENCER $GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # release already created from the GitHub web page: just attach the builds
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "DR. SEGG-UENCER $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
